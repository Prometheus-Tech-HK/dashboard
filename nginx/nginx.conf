events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Define the backend service address
    upstream backend_app {
        server localhost:3000;
    }

    server {
        # Listening on port 3000 as requested
        listen 80;
        server_name dashboard-simple.prometheus.nexus;

        # Max upload size
        client_max_body_size 20M;

        # Proxy all requests to the backend
        location / {
            proxy_pass http://localhost:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Optional: Optimization for static files if served by backend
        # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        #     proxy_pass http://backend_app;
        #     expires 30d;
        #     add_header Cache-Control "public, no-transform";
        # }
    }
}
